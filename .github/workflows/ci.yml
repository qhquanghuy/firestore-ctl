name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job runs every check once: ShipIt's recheck runs `.config/shipit.toml`'s commands (fmt,
  # clippy, rustdoc, then every test under coverage with the emulator); the steps after it only
  # read that run's coverage data. The Nix packaging is built by the release workflow.
  gate:
    name: shipit recheck (fmt, clippy, rustdoc, all tests with coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      line-percent: ${{ steps.percent.outputs.line-percent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: qhquanghuy/shipit@92b780954e4920397a148c5e0a2801a506dc8f13 # same commit as flake.lock
      - name: Coverage summary
        shell: bash
        run: |
          {
            echo '### Coverage (unit, CLI, app_flow and emulator tests)'
            echo
            echo '```'
            nix develop --command cargo llvm-cov report --summary-only --ignore-filename-regex 'src/domain/arb\.rs$'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Line coverage for the badge
        id: percent
        run: |
          nix develop --command cargo llvm-cov report --json --summary-only --ignore-filename-regex 'src/domain/arb\.rs$' --output-path "$RUNNER_TEMP/coverage.json"
          percent=$(jq -r ".data[0].totals.lines.percent" "$RUNNER_TEMP/coverage.json")
          printf 'line-percent=%.1f\n' "$percent" >> "$GITHUB_OUTPUT"

  # Separate job so no PR run holds a write token, and so the job that builds and runs repo
  # code never has one. It runs no repo code and needs no checkout.
  badge:
    name: publish the coverage badge
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PERCENT: ${{ needs.gate.outputs.line-percent }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Write coverage.json to the orphan `badges` branch
        run: |
          if ! [[ "$PERCENT" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::unexpected coverage value: $PERCENT"
            exit 1
          fi
          color=$(awk -v p="$PERCENT" 'BEGIN { print (p >= 80 ? "green" : p >= 60 ? "yellow" : "red") }')
          cd "$(mktemp -d)"
          git init --quiet --initial-branch=badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PERCENT" "$color" > coverage.json
          git add coverage.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet --message "coverage: $PERCENT%"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)
          echo "::add-mask::$auth"
          # A fresh single-commit tree each time: no history growth, and it works while the branch does not exist yet.
          git -c "http.extraheader=Authorization: Basic $auth" \
            push --force "https://github.com/${GITHUB_REPOSITORY}.git" badges
