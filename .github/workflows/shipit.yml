name: shipit

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # remove this step if your check commands do not need Nix
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: qhquanghuy/shipit@92b780954e4920397a148c5e0a2801a506dc8f13 # same commit as flake.lock
