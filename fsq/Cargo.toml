[package]
name = "fsq"
version = "0.1.0"
edition = "2024"
description = "Query Firestore from the command line"
publish = false

[lib]
name = "fsq"
path = "src/lib.rs"

[[bin]]
name = "fsq"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
comfy-table = "7"
gcloud-sdk = { version = "0.34", default-features = false, features = [
    "google-firestore-v1",
    "google-firestore-admin-v1",
    "tls-webpki-roots",
    "jwt-aws-lc-rs",
    "auth-default-crypto",
] }
itertools = "0.15"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
pretty_assertions = "1"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
strip = true
